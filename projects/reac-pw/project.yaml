# reac-pw: the FreeREAC daemon that bridges Roland REAC and PipeWire. The fuzz targets drive the readers of the
# untrusted input it parses itself, beside the REAC frames libreac parses: the operator's config file and `--box` pin,
# the three control writes a PipeWire client sets on a node, and the two rtnetlink replies it reads. Pinned to the
# merge of FreeREAC/reac-pw#52 on main, which holds the fuzz/ of FreeREAC/reac-pw#37, #51 and #52.
repo: https://github.com/FreeREAC/reac-pw#75787af6aaccffd98f8e2e1bd55491981fe33aa9
primary_contact: linuxnow@gmail.com
homepage: https://github.com/FreeREAC/reac-pw
language: c
sanitizers: [address, undefined]
mutants: fuzz/sabotage
fuzz_targets:
  - fuzz_segconf
  - fuzz_pin
  - fuzz_headamp
  - fuzz_rate
  - fuzz_role
  - fuzz_qdisc
  - fuzz_link
