# libdiginet: the DigiNet protocol of the Digidesign Control|24 and ProControl control surfaces, raw Ethernet frames
# (EtherType 0x885F), for FreeMixer. The fuzz targets drive the readers of every byte a desk sends: the frame, the
# command stream, the controls in it, the session they drive and the desk mux that hands each desk its own. Pinned to
# main at the merge of the 0.1.5 release.
repo: https://github.com/FreeMixer/libdiginet#e243a6240872abfdb244053c730af18f03a74cbb
primary_contact: linuxnow@gmail.com
homepage: https://github.com/FreeMixer/libdiginet
language: c
sanitizers: [address, undefined]
mutants: fuzz/sabotage
fuzz_targets:
  - fuzz_frame
  - fuzz_decode
  - fuzz_codec
  - fuzz_transport
  - fuzz_mux
