name: Hosted check

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project name under projects/"
        required: true
        type: string
      ref:
        description: "Branch or commit of this repository to check out"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -o pipefail
          git rev-parse HEAD | tee check.log
          uv run oss-verify check --no-shell --twice "$PROJECT" 2>&1 | tee -a check.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-log-${{ inputs.project }}
          path: check.log
