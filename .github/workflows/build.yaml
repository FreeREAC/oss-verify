# Adapted from OSS Scanner's .github/workflows/build.yaml (https://github.com/anthropics/oss-scanner), Copyright 2026
# Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs, PBC: builds twice with OSS Verify's tools/check, maps its
# exit codes, accepts OSS Verify's file names, measures the fuzz targets' checks, and adds the review and its comment.
name: "Build"
# Builds the project an enrollment pull request adds or changes with tools/check --twice: everything is built a second
# time from scratch, and the two builds must have the same bytes, as they must before we pin a binary. The output is in
# the run's log; the step summary also has one row for each binary: its target, build, file size, .text size and whether
# it is statically linked. With --checks, tools/check also measures what the fuzz targets' checks catch on their seed
# inputs (docs/build-contract.md, "The checks of a fuzz target"), and does four checks on each binary: its instructions,
# its system calls against the process model of the published proofs, its quiet twin, and the code it links
# uninstrumented (docs/build-contract.md, "The checks of the binaries"). The step summary has both reports too.
#
# Then three more jobs:
#   record   writes the build's record, the artifact enrollment-record: the pull request, the project, the commit
#            project-builds built, and each binary's .text and executable bytes, for enroll-dispatch.yml, which starts
#            the theorem statements once every required check has passed.
#   review   Claude Code follows .claude/skills/review-enrollment/SKILL.md on what the workflow gathered: the pull
#            request, the project's source at the built commit, and the build's results. It writes a comment that asks
#            the maintainer for each fix. On a later push it resumes the conversation of the last review, so it knows
#            what it asked for and why, and checks those requests against the changes since then.
#   comment  posts that comment, with the checks' report folded under it, or replaces the one already there. The
#            comment starts with <!-- oss-verify-review -->, as the triage comment starts with its own marker.
#
# project-builds is a required check: it runs on every pull request (.github/scripts/take-project says which project
# it takes):
#   - A pull request from a fork is judged on the files GitHub lists for it: it fails if it changes anything but one
#     project, which is built as it is at the fork's head. A pull request from a branch of this repository is judged
#     on what merging it into the base branch changes (git merge-tree): it fails if the merge conflicts, and the one
#     project the merge changes is built as the merge has it, whatever else the pull request changes; those other
#     files are not taken. So a stacked branch whose parent is merged, a renamed project, or a project the base branch
#     renamed since the branch left it, still has its one project built.
#   - It passes with "nothing to build" in the summary for a pull request that changes no file or removes its project,
#     and for one from a branch of this repository whose merge changes no project or several ("Not an enrollment").
#     The merge decides for a branch of this repository however many files it changes; a fork that changes more than
#     the 3000 files the API lists fails, because that list is the fork's only rule.
#   - It fails for a pull request into any branch but the default one. The ruleset that requires the check guards only
#     the default branch, so this failure blocks nothing, and it keeps a result judged against another branch from
#     ever standing as a pass on the head commit if the base is then changed to the default branch.
#   - It fails if the pull request's head or base moves while the step reads it; the run for the newest commit or
#     base checks it again.
# It runs on edited too, so that changing the base runs it again against the new base. edited is also sent when the
# title or description is edited, and the project is then built again in full: a run that skipped its build would
# replace an earlier result with a pass.
# A failure is usually the project's, but it can be the runner's: GitHub's runner may run out of disk or time on a
# build that works on a larger machine. A maintainer then reruns the failed job (gh run rerun <run> --failed). If it
# fails again for the runner's reason, the maintainer builds the project with `tools/check --no-shell --twice <name>` on
# a larger machine and says so in the pull request; the check stays red until a rerun passes, so merging before then
# needs a bypass of the ruleset that requires it.
#
# pull_request_target, not pull_request, so the pull request cannot edit this workflow or tools/check:
#   - The checkout is the base branch, never the pull request, so a project is built with the base branch's tools.
#   - Only the files directly inside the one projects/<name>/ are taken from it, as regular files written from git's
#     object store.
#   - Its Dockerfile runs only inside `docker build`, and its build.sh and the fuzz targets only inside
#     `docker run --network=none` or qemu-riscv64 (tools/check --checks), never as a step of their own on the runner.
#
# project-builds builds code from anyone. The toolchain images in infra/toolchains.tsv are public, so the job pulls the
# one image tools/check will build FROM without signing in, for every pull request, before the pull request's
# Dockerfile or build.sh runs. Never add a secret, a cache, an artifact, an identity token or a write permission to that
# job. Its results reach the other jobs only as job outputs, which this repository's tools write: text, never code.
# The review job runs no code of the pull request or the project. It and the comment job hold identity tokens
# (id-token: write), which they trade for short-lived tokens: the review's for an Anthropic token by workload identity
# federation, so no API key is stored, and both jobs' for a Google access token by Google workload identity
# federation (Theorem's infrastructure code). Claude
# gets three tools only, Read, Glob and Grep, inside the checkout (.github/scripts/review-run), and an environment
# without the runner's tokens. Its review is posted only when the provider and model it asked for, at that provider's
# own API, answered every turn, as Claude Code reported each turn (.github/scripts/review-served);
# every comment names the providers and models that answered, with their turns, or says why nothing shows which.
# The comment job alone writes: it posts text, refused if it holds what looks like a
# credential (.github/scripts/review-comment), as the oss-verify GitHub App (oss-verify[bot]), with an installation
# token that can write pull requests in this repository only. It makes that token from the App's client id below and
# its private key, which it reads at run time from Secret Manager (oss-verify-github-app-key), and runs no code of the
# pull request or the project.
#
# This repository stores no long-lived credential for any of that. Google's provider admits this file, triage.yaml
# and the enrollment workflow enroll-dispatch.yml, each on refs/heads/main and only from its own events (here
# pull_request_target and workflow_dispatch). A token carries no job name, so what keeps each Google account to the
# job that needs it is the job's GitHub Environment, which the token carries a claim for: `ossv-ci`, which reads the
# cost collector's token and nothing else, can be acted as only from the environment `enroll-review`, which the
# review job declares; `ossv-app-comment`, the account these jobs read the App's key as, only from `comment`, which
# the comment job declares. A job that declares no environment, project-builds among them, reaches neither account, and
# project-builds, which builds the pull request's code, must never be given id-token: write.
# A pull request from a fork gets the same identity tokens in the review and comment jobs: pull_request_target runs
# this file from the base branch, never the fork's, so the fork's code never holds them.
# Runs do not wait for a maintainer's approval. To build only on request, remove pull_request_target below.
#
# The review reaches Claude by workload identity federation, with no stored key: the review job's GitHub identity token
# is traded for an Anthropic token, by the federation rule whose ids the Review step gives (ids, not secrets). A rule,
# made in the Claude Console of Anthropic's organization "Theorem - HDO", grants Claude calls only:
#   issuer   fdis_01JvJ1UhZ8X2HHgcmXqjkJbc: https://token.actions.githubusercontent.com, keys by discovery
#   main     fdrl_019restxFx3PhpLhbziQoQKf: subject_prefix "repo:theorem-labs@212152656/oss-verify@1429568498:*",
#            audience "https://api.anthropic.com", claims {"repository_id": "1429568498",
#            "ref": "refs/heads/main", "workflow": "Build"}, and the condition
#            claims.workflow_ref.startsWith("theorem-labs/oss-verify/.github/workflows/build.yaml@")
#   target   the service account oss-verify-ci (svac_01WdHTLcJPEfiPttcuLK1hGT), with the developer role
#   scope    workspace:inference, in the workspace Default+CVP, with a token lifetime of 3600 seconds
# The numbers are the immutable ids of theorem-labs and of this repository. `workflow` is the workflow's display name
# (its `name:`), not its file, and `ref` is the run's ref; the condition pins the file, so the rule gives a token only
# to this file, build.yaml, on main, from any event (a fork's pull_request_target run carries this repository's
# workflow_ref, so it signs in too). The review and comment jobs of this
# file ask for an identity token; no other job of it does.
# A review runs only on main: the Anthropic rule above admits refs/heads/main alone, so a run on another branch gets
# no Anthropic token (and Google's provider, which also admits main alone, gives it no collector token). So a change to
# the review is tried for real only once it is on main: run `gh workflow run build.yaml -f pr=<n>` against a pull
# request opened by this repository, never a maintainer's open enrollment, because the run posts its comment there.
# Before the merge, tools/tests runs the review's steps with stand-ins.
#
# The review's Claude Code exports its usage by OpenTelemetry to Theorem's cost collector, at the public URL below
# (a literal here because it is public), with the collector's bearer token, which the Review step reads at run time
# from Secret Manager (agent-spend-otel-token, whose readers Theorem's infrastructure code names). The export is
# tagged theorem.project=oss-verify, theorem.subproject=<name>, theorem.lane=enroll-review-ci and
# theorem.credential=oss-verify-ci (.github/scripts/review-run sets them). The export is a measurement and never
# decides whether an enrollment gets its review: if the sign-in or the read fails, or the collector refuses the token
# or does not answer (before the review, or after a review that wrote its comment), the run's page carries a warning
# saying that this review's usage is not exported (a failed sign-in also shows the sign-in step's own error), and the
# review runs to its end and its comment is posted. A lost export is read from that warning, never from the job's
# result.
#
# The review's conversation goes from one push to the next as an artifact of the review's run, named
# enroll-review-<pull request>-<project>, sealed (AES-256-GCM) by .github/scripts/review-session under a key derived
# from REVIEW_CONVERSATION_KEY (32 random bytes, base64), a secret of the environment enroll-review. The review job
# restores the newest one of the pull request and project that build.yaml uploaded, that opens with the key, and whose
# review is the one the review comment shows; review-run resumes it in a fork (claude --resume <id> --fork-session) and
# keeps the new conversation, and the review job seals and uploads that once the review has written a comment. The logs
# of the Restore and Review steps say which it did: "review-run: resuming the conversation <id> of the review of
# <commit>", or "a fresh review". A conversation holds the public inputs the review read and the review's own
# reasoning, which no log or comment shows, and no token: review-run keeps none that looks like a credential. It is
# sealed because anyone signed in to GitHub can download this repository's artifacts, and it is not in the Actions
# cache because every pull request's own run, a fork's too, can read main's caches (the header of
# .github/scripts/review-session has the measurement).
# Only the review job holds the key, and only the review job can act as ossv-ci: both come with the environment
# enroll-review. Its deployment branch rule, declared in Theorem's infrastructure code, allows main alone; GitHub
# checks it against the run's ref, which is main for pull_request_target and refs/pull/<n>/merge for a pull request's
# own run (https://github.blog/changelog/2025-11-07-actions-pull_request_target-and-environment-branch-protections-changes).
# That rule is the second lock beside Google's provider, which admits refs/heads/main alone.
# Without the key the review runs fresh on each push, with a warning. An artifact lasts as
# long as the repository's artifact retention (90 days by default). The environment, its deployment branch rule and
# the key are declared in the organisation's infrastructure code, and made by its apply: do not make them by hand, which
# the next apply would undo or fail on. A new key, or a new seal version in review-session, discards every kept
# conversation.
#
# To build a pull request by number:
#   gh workflow run build.yaml -f pr=123
# Such a run reports a check named project-builds too, but a check from a workflow_dispatch run never satisfies a
# ruleset's required check (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#checks-from-some-workflow-jobs-are-not-evaluated).

run-name: ${{ github.event.pull_request.title || format('Pull request {0}', inputs.pr) }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the pull request to build"
        required: true
        type: number

permissions: {}

concurrency:
  # By event too, so that a run started by hand never cancels the pull request's own run of the required check.
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  project-builds:
    # A static name: GitHub reports the check under it on every run, and a required job has no job-level if:.
    name: project-builds
    runs-on: ubuntu-24.04
    # tools/check has no time limit of its own: this one is the runner's, the most it allows, for two builds and
    # --checks (at most 30 minutes of runs for the checks of the binaries, 2 x 20 minutes of seed runs on the unchanged
    # code, and the 45-minute budget of the breakages).
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
    # Text that this repository's tools wrote, for the review, comment and record jobs.
    outputs:
      name: ${{ steps.project.outputs.name }}
      sha: ${{ steps.project.outputs.sha }}
      commit: ${{ steps.build.outputs.commit }}
      result: ${{ steps.build.outputs.result }}
      binaries: ${{ steps.build.outputs.binaries }}
      checks: ${{ steps.build.outputs.checks }}
      sizes: ${{ steps.build.outputs.sizes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false

      - name: Take projects/<name>/ from the pull request, and nothing else
        id: project
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # Empty on a run started by hand, which builds the pull request's head as the API gives it.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/take-project build

      - name: Make room, and install PyYAML and qemu
        if: steps.project.outputs.name != ''
        run: |
          # Unused toolchains, removed to free disk for the build: the toolchain image alone is about 6 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          # qemu-riscv64-static runs the fuzz targets for tools/check --checks, inside a container of the project image.
          # It is taken out of its package, not installed: the package registers qemu with the kernel for riscv64
          # programs (binfmt_misc), and a build.sh could then run the riscv64 programs that it makes. (From #24.)
          # Without it, --checks says that it could not measure, and the build is checked as before.
          # The check of system calls reads the runs of qemu 10.0.11 only (tools/check_binaries.py QEMU_VERSIONS), so this
          # is Debian 13's qemu-user 1:10.0.11+ds-0+deb13u1, pinned by its SHA-256 at its snapshot.debian.org address:
          # the build theorem-labs/oss-verify-proofs's toolchain/runner.Dockerfile runs counterexamples with. Its
          # qemu-riscv64 is a static binary; the -static name is the one tools/check looks for.
          mkdir "$RUNNER_TEMP/qemu" && cd "$RUNNER_TEMP/qemu"
          deb=qemu-user_10.0.11+ds-0+deb13u1_amd64.deb
          if curl -fsSL --retry 3 -o "$deb" https://snapshot.debian.org/file/a0eaa62f815efb2361d43b1e3f8011c17ad9123a \
              && echo "6b6fea55551fbcc1eb30e146ad5abdfbb49f8fa8c5998016242126de4d7f80df  $deb" | sha256sum -c --quiet \
              && dpkg-deb -x "$deb" . && ln -s qemu-riscv64 usr/bin/qemu-riscv64-static \
              && usr/bin/qemu-riscv64-static --version | grep -q 'version 10\.0\.11'; then
            echo "$RUNNER_TEMP/qemu/usr/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::No qemu-riscv64-static 10.0.11: tools/check --checks cannot run the fuzz targets."
          fi

      - name: Pull the pinned toolchain image
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
        run: |
          set -euo pipefail
          # Until the token is printed again, the runner reads none of tools/check's output about the project as a
          # workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          image=$(python3 tools/check --print-toolchain "projects/$NAME" < /dev/null)
          echo "::$resume::"
          [[ $image == *@sha256:* ]] || { echo "::error::Unpinned toolchain image: $image"; exit 1; }
          docker pull "$image"

      - name: Build the project twice with tools/check, and measure its checks
        id: build
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
          SHA: ${{ steps.project.outputs.sha }}
        run: |
          # Until the token is printed again, the runner reads none of the build's output as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          code=0
          summary="$RUNNER_TEMP/binaries.md"
          checks="$RUNNER_TEMP/checks.md"
          # The path, as in the pull step, never the bare name: tools/check reads a bare name as a directory of the
          # checkout's root when that directory has a project.yaml, as templates/ does. Its table shows a target name,
          # which the pull request chooses, in code with every unusual byte as %XX. --checks changes no exit status.
          python3 tools/check --no-shell --twice --summary "$summary" --checks "$checks" --checks-budget 45 \
            "projects/$NAME" < /dev/null \
            || code=$?
          echo "::$resume::"

          case $code in
            0) result="builds, and a second build from scratch has the same bytes" ;;
            1) result="does not build (the log says which step failed)" ;;
            2) result="breaks the enrollment rules (the log lists them)" ;;
            3) result="builds, but a second build from scratch has different bytes (the log says which)" ;;
            *) result="could not be checked: tools/check exited $code" ;;
          esac
          echo "\`projects/$NAME/\` at \`${SHA:0:7}\` $result." >> "$GITHUB_STEP_SUMMARY"
          for file in "$summary" "$checks"; do
            if [ -f "$file" ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # For the review: the commit the build fetched, from the manifest tools/check wrote, and the three texts.
          commit=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["commit"])' \
            ~/.cache/oss-verify-check/"$NAME"/manifest.yaml 2> /dev/null || true)
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || commit=""
          # For the record job: each binary's .text bytes and executable bytes (.github/scripts/binary-sizes), as one
          # line of JSON {target: {build: {text, exec}}}, with null for a size that could not be read.
          sizes=$(python3 .github/scripts/binary-sizes ~/.cache/oss-verify-check/"$NAME" 2> /dev/null < /dev/null || true)
          [[ $sizes == "{"*"}" && $sizes != *$'\n'* ]] || sizes=""
          # A random delimiter, so that no text can end an output early.
          delimiter="output-$(openssl rand -hex 16)"
          {
            echo "commit=$commit"
            echo "sizes=$sizes"
            echo "result=\`projects/$NAME/\` at \`${SHA:0:7}\` $result"
            for output in binaries checks; do
              file=$summary
              [ "$output" = binaries ] || file=$checks
              echo "$output<<$delimiter"
              if [ -f "$file" ]; then
                head -c 60000 "$file"; echo
                if [ "$(wc -c < "$file")" -gt 60000 ]; then
                  echo "(Cut at 60,000 bytes: the rest is in the Build check's step summary.)"
                fi
              fi
              echo "$delimiter"
            done
          } >> "$GITHUB_OUTPUT"

          [ "$code" = 0 ] || echo "::error::projects/$NAME/ $result."
          exit "$code"

  record:
    # The build's record, for enroll-dispatch.yml: the pull request, the project, the head commit project-builds built,
    # and each binary's .text and executable bytes. A workflow that another run starts cannot read this run's job
    # outputs, so this job writes them, as text that this repository's tools wrote, into the artifact
    # enrollment-record. It runs no code of the pull request or the project, checks out nothing, and holds no
    # permission: the artifact goes up with the runner's own artifact token, which every job has. On a run started by
    # hand (gh workflow run build.yaml -f pr=<n>) the record is of that pull request's head as the API gave it, which
    # is how a maintainer has enroll-dispatch.yml look again at a pull request.
    needs: project-builds
    if: ${{ !cancelled() && needs.project-builds.result == 'success' && needs.project-builds.outputs.name != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write the record
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          NAME: ${{ needs.project-builds.outputs.name }}
          SHA: ${{ needs.project-builds.outputs.sha }}
          SIZES: ${{ needs.project-builds.outputs.sizes }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/record"
          jq -n --argjson pr "$PR" --arg project "$NAME" --arg sha "$SHA" --argjson sizes "${SIZES:-null}" \
            '{schema: "oss-verify enrollment record v1", pr: $pr, project: $project, sha: $sha, sizes: $sizes}' \
            > "$RUNNER_TEMP/record/record.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        with:
          name: enrollment-record
          path: ${{ runner.temp }}/record/record.json
          if-no-files-found: error
          retention-days: 30
          # A re-run of the job replaces the record of its run, so that the run keeps one.
          overwrite: true

  review:
    # Claude reviews the enrollment with .claude/skills/review-enrollment/SKILL.md. It runs after the build, whatever
    # its result, so that the review can ask for the build's fixes too. It runs no code of the pull request.
    needs: project-builds
    if: ${{ !cancelled() && needs.project-builds.outputs.name != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # enroll-review holds the key that seals the review's conversation, and it is the only environment from which a
    # job can act as ossv-ci, the collector token's reader (the top of this file). No deployment: the pull request
    # shows none, and the environment claim is in the token either way.
    environment:
      name: enroll-review
      deployment: false
    permissions:
      contents: read
      pull-requests: read
      # For the pull request's checks, which the review reads.
      checks: read
      statuses: read
      # Also for the artifacts of the review's earlier runs (the conversation).
      actions: read
      # Only for the GitHub identity tokens that federation trades for an Anthropic token and for a Google access
      # token of ossv-ci@theorem-agent-infra. This job runs no code of the pull request.
      id-token: write
    env:
      # Theorem's Google project, as Theorem's infrastructure code declares them. Public identifiers, not
      # credentials: the provider admits this file, triage.yaml and enroll-dispatch.yml on refs/heads/main, and only
      # a job in the environment enroll-review can act as this account.
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/github/providers/github-ossv
      GCP_SERVICE_ACCOUNT: ossv-ci@theorem-agent-infra.iam.gserviceaccount.com
    outputs:
      comment: ${{ steps.review.outputs.comment }}
      # What answered the review, as .github/scripts/review-served recorded it, for the comment job to check.
      served: ${{ steps.review.outputs.served }}
      # true when review-run refused the review (exit 4): another provider or model answered, or nothing shows which.
      refused: ${{ steps.review.outputs.refused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          # The history of .github/PULL_REQUEST_TEMPLATE.md, for check B of the skill.
          fetch-depth: 0

      - name: Take projects/<name>/ from the pull request, as the build did
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # The head that the build took, also on a run started by hand.
          HEAD_SHA: ${{ needs.project-builds.outputs.sha }}
        run: GITHUB_STEP_SUMMARY=/dev/null .github/scripts/take-project build

      # The conversation of the last review of this pull request and project, which the review resumes (sealed, at the
      # top of this file). None on its first review, or once its artifact has expired: a fresh review. A failure of
      # this step (an install, a time limit) gives a fresh review too, never no review: review-run resumes only a
      # directory whose `session` file, written last, names a whole conversation.
      - name: Restore the last review's conversation
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          NAME: ${{ needs.project-builds.outputs.name }}
          REVIEW_CONVERSATION_KEY: ${{ secrets.REVIEW_CONVERSATION_KEY }}
        run: |
          dpkg -s python3-cryptography > /dev/null 2>&1 \
            || sudo apt-get install -y -qq python3-cryptography \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography; }
          .github/scripts/review-session restore "$RUNNER_TEMP/review-session"

      - name: Gather what the review reads
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          NAME: ${{ needs.project-builds.outputs.name }}
          COMMIT: ${{ needs.project-builds.outputs.commit }}
          RESULT: ${{ needs.project-builds.outputs.result }}
          BINARIES: ${{ needs.project-builds.outputs.binaries }}
          CHECKS: ${{ needs.project-builds.outputs.checks }}
          BUILD_CONCLUSION: ${{ needs.project-builds.result }}
          # For the changes since the last review's commit, when there is one.
          HEAD_SHA: ${{ needs.project-builds.outputs.sha }}
          REVIEW_SESSION: ${{ runner.temp }}/review-session
        run: |
          dpkg -s python3-yaml unzip > /dev/null 2>&1 \
            || sudo apt-get install -y -qq python3-yaml unzip \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml unzip; }
          mkdir -p .review/build
          printf 'The Build check %s: %s.\n' "$BUILD_CONCLUSION" "${RESULT:-no result}" > .review/build/result.md
          printf '%s\n' "$BINARIES" > .review/build/binaries.md
          printf '%s\n' "$CHECKS" > .review/build/checks.md
          # Until the token is printed again, the runner reads none of the gathered text as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          .github/scripts/review-gather .review
          echo "::$resume::"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.310

      # Theorem's Google project trusts this workflow's identity token (Theorem's infrastructure code), so the
      # collector's token is read at run time instead of being stored here. Nothing is written to the workspace and
      # nothing is exported: the Google access token is this step's output alone, and it lives five minutes. The
      # token only feeds the usage export, so a failed sign-in must not stop the review: continue-on-error, and the
      # Review step warns and runs without the export when the output is empty. The run's page then shows this
      # step's own error annotation beside that warning; the job's result is the review's.
      - name: Sign in to Google Cloud
        id: gcp
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Get the GitHub identity token for Anthropic
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/oidc"
          # The request token reaches curl through a pipe, not an argument, which other processes can read.
          curl -q -sSf -H @<(printf 'Authorization: Bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$RUNNER_TEMP/oidc/jwt"
          echo "::add-mask::$(cat "$RUNNER_TEMP/oidc/jwt")"

      - name: Review
        id: review
        timeout-minutes: 45
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          NAME: ${{ needs.project-builds.outputs.name }}
          # Claude Code trades the identity token for an Anthropic token, which lives at most twice the five minutes a
          # GitHub identity token has, and reads this file again for each new one. review-run writes a new identity
          # token into it every minute, through the request URL and token the runner gives this step, so that each
          # exchange reads one that is not expired and not used before.
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc/jwt
          # The federation rule above, in Anthropic's organization "Theorem - HDO".
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_019restxFx3PhpLhbziQoQKf
          ANTHROPIC_ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01WdHTLcJPEfiPttcuLK1hGT
          ANTHROPIC_WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
          # Usage, to Theorem's cost collector. review-run checks that the collector takes the token, and runs the
          # review without the export if it does not. The collector's public URL.
          OTEL_EXPORTER_OTLP_ENDPOINT: https://agent-otel-public-6acxmql5za-uw.a.run.app
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          # The conversation of the last review, which review-run resumes, and the commit this review is of. After a
          # review, the directory holds this review's conversation, which the next step keeps for the next push.
          HEAD_SHA: ${{ needs.project-builds.outputs.sha }}
          REVIEW_SESSION: ${{ runner.temp }}/review-session
        run: |
          # The collector's bearer token: Secret Manager agent-spend-otel-token, which Theorem's infrastructure code
          # declares and grants this job's account. It stays a variable of this shell, masked in the log and no
          # process's argument. The export is a measurement and never decides whether the review runs: if the sign-in
          # failed, or the read fails, or the value is blank, this is one warning and review-run exports nothing.
          # The select() refuses a response with no payload, which would otherwise decode "null" into bytes that
          # look like a token; jq then prints nothing, so the value is empty and the blank check below warns.
          OTEL_COLLECTOR_TOKEN=""
          if [ -n "$GCP_ACCESS_TOKEN" ]; then
            OTEL_COLLECTOR_TOKEN=$(curl -q -sSf -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
              'https://secretmanager.googleapis.com/v1/projects/theorem-agent-infra/secrets/agent-spend-otel-token/versions/latest:access' \
              | jq -er '.payload.data | select(type == "string" and length > 0)' | base64 -d) || OTEL_COLLECTOR_TOKEN=""
          fi
          # The Google access token is needed for nothing else, so review-run and Claude Code never inherit it.
          unset GCP_ACCESS_TOKEN
          # One mask command covers one line, so each line of the value is masked: the declared token is one line of
          # 48 characters, and a replacement that is not stays out of the log this way too.
          while IFS= read -r line; do
            if [[ $line == *[![:space:]]* ]]; then builtin printf '::add-mask::%s\n' "$line"; fi
          done <<< "$OTEL_COLLECTOR_TOKEN"
          # A value of whitespace alone is no token: without this, review-run would skip the export with no warning.
          if [ -z "${OTEL_COLLECTOR_TOKEN//[[:space:]]/}" ]; then
            OTEL_COLLECTOR_TOKEN=""
            echo "::warning::Could not read the cost collector's token (Secret Manager agent-spend-otel-token in theorem-agent-infra), so this review's usage does not reach Theorem's cost collector. The review runs."
          fi
          export OTEL_COLLECTOR_TOKEN
          # Until the token is printed again, the runner reads none of the review's output as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          code=0
          .github/scripts/review-run .review || code=$?
          rm -f "$ANTHROPIC_IDENTITY_TOKEN_FILE" "$ANTHROPIC_IDENTITY_TOKEN_FILE".new.*
          # The record of what answered, also when the review is not to be posted or did not finish: the comment job
          # checks it, and names what answered. Its names are ones review-served cleaned, so it holds no command.
          if [ -f .review/served ]; then
            delimiter="served-$(openssl rand -hex 16)"
            { echo "served<<$delimiter"; cat .review/served; echo; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          fi
          echo "::$resume::"
          # A lost export, on the run's page: review-run's own line, shown only if it is plain words, so it holds no
          # command. It never changes the step's result.
          lost=$(grep -m1 -xE '[A-Za-z0-9 ,.()-]{1,200}' .review/export-lost.txt 2> /dev/null) || lost=""
          if [ -n "$lost" ]; then echo "::warning::Usage export: $lost."; fi
          if [ "$code" = 4 ]; then
            echo "refused=true" >> "$GITHUB_OUTPUT"
            # 4: another provider or model answered, or nothing shows which (review-served). The comment job posts
            # none of the review, and says what answered. review-run's line names only what review-served cleaned.
            failure=$(grep -m1 -xE "the review is not published: [][A-Za-z0-9 ,.:;@+?/*()'_-]{1,2100}" \
              .review/failure.txt 2> /dev/null) \
              || failure="the review is not published: review-run gave no reason"
            echo "::error::${failure^}"
            { echo "### The review is not published"; echo; echo "    $failure"; } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          elif [ "$code" != 0 ]; then
            # Why, on the run's page and in the job's summary, not only in the log above: review-run's own line of
            # plain words from failure.txt, and Claude Code's message from failure-detail.txt with no backtick, so
            # that it stays inside its code block. The summary is public: a message that holds what looks like a
            # credential (review-comment's scan, over the whole file; an error of the scan counts as one) or the
            # collector's token is not shown.
            failure=$(grep -m1 -xE '[A-Za-z0-9 ,._()-]{1,200}' .review/failure.txt 2> /dev/null) || failure=""
            failure=${failure:-review-run ended with exit status $code before Claude Code wrote a result}
            detail=$(head -c 1000 .review/failure-detail.txt 2> /dev/null | tr -d '`' | tr '[:cntrl:]' ' ') || true
            scan=0
            [ -z "$detail" ] || python3 .github/scripts/review-comment --holds-credential < .review/failure-detail.txt \
              || scan=$?
            if [ "$scan" != 3 ]; then detail=""; fi
            if [ -n "$OTEL_COLLECTOR_TOKEN" ] && [[ $detail == *"$OTEL_COLLECTOR_TOKEN"* ]]; then detail=""; fi
            echo "::error::The review did not finish: $failure"
            {
              echo "### The review did not finish"
              echo
              echo "$failure."
              if [ -n "$detail" ]; then
                echo
                echo "Claude Code's message:"
                echo
                echo '```'
                echo "$detail"
                echo '```'
              fi
              echo
              echo "The log of the Review step has each try's ending."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          # The collector's token never leaves this job (review-comment refuses the other credentials). Compared in
          # this shell, so that the token is no process's argument.
          if [ -n "$OTEL_COLLECTOR_TOKEN" ] && [[ $(< .review/comment.md) == *"$OTEL_COLLECTOR_TOKEN"* ]]; then
            echo "::error::The review's comment holds the collector's token; it is not posted."
            exit 1
          fi
          delimiter="review-$(openssl rand -hex 16)"
          { echo "comment<<$delimiter"; head -c 60000 .review/comment.md; echo; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          if [ -s "$REVIEW_SESSION/session" ]; then echo "session=kept" >> "$GITHUB_OUTPUT"; fi

      - name: Seal this review's conversation for the next push's review
        id: seal
        if: ${{ steps.review.outputs.session == 'kept' }}
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          NAME: ${{ needs.project-builds.outputs.name }}
          REVIEW_CONVERSATION_KEY: ${{ secrets.REVIEW_CONVERSATION_KEY }}
        run: |
          sealed="$RUNNER_TEMP/review-sealed/conversation.sealed"
          .github/scripts/review-session seal "$RUNNER_TEMP/review-session" "$sealed"
          if [ -s "$sealed" ]; then echo "sealed=$sealed" >> "$GITHUB_OUTPUT"; fi

      # Public, as every artifact of this repository is: it opens only with the key (the top of this file).
      - name: Keep the sealed conversation for the next push's review
        if: ${{ steps.seal.outputs.sealed != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        with:
          name: enroll-review-${{ github.event.pull_request.number || inputs.pr }}-${{ needs.project-builds.outputs.name }}
          path: ${{ steps.seal.outputs.sealed }}
          if-no-files-found: error
          # Sealed bytes do not compress. A re-run of the job replaces the artifact of its run.
          compression-level: 0
          overwrite: true

      # Whatever happened above, the Anthropic identity token does not outlive this job: a step that exits before its
      # own `rm` (a failed `openssl rand`, for one) leaves the file, and this removes it.
      - name: Remove the Anthropic identity token
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/oidc/jwt"

  comment:
    needs: [project-builds, review]
    # After a review that wrote a comment, it posts it, whatever happened to the usage export.
    # After a review that wrote none, it marks the comment already there as not current, naming the commit it is of,
    # or posts that the review did not run if there is none.
    if: ${{ !cancelled() && needs.project-builds.outputs.name != '' && (needs.review.result != 'success' || needs.review.outputs.comment != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The GitHub Environment is what gets this job the App's key and keeps it from every other job: its identity
    # token carries an `environment` claim, and only a token with that claim may act as ossv-app-comment, the
    # dedicated reader of the key for these jobs (Theorem's infrastructure code). Its one protection rule is
    # the deployment-branch policy `main` (Theorem's infrastructure code); it has no
    # required reviewer and no wait timer, so it adds no wait and no approval. Removing this line does not weaken the
    # job; it stops it working.
    # deployment: false, so a comment posts no deployment on the pull request; the environment claim, which is what
    # the account needs, is in the token either way (measured on a run of this file).
    environment:
      name: comment
      deployment: false
    # One comment job at a time for a pull request, whatever event started its run (the run's own group is by event):
    # two at once could each find no comment, each post one, and only the first would ever be updated after.
    concurrency:
      group: build-comment-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    permissions:
      # contents: read only for the checkout of .github/scripts, which a job with no contents permission cannot make.
      # It writes with the oss-verify App's token, not this job's.
      contents: read
      # Only for the GitHub identity token that Google's federation trades for an access token of
      # ossv-app-comment@theorem-agent-infra, which reads the App's key. This job runs no code of the pull request.
      id-token: write
    env:
      # The review job's provider, and the account only a job in this environment can act as
      # (Theorem's infrastructure code).
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/github/providers/github-ossv
      GCP_SERVICE_ACCOUNT: ossv-app-comment@theorem-agent-infra.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Sign in to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      # The App's private key: Secret Manager oss-verify-github-app-key in theorem-agent-infra, which Theorem's
      # infrastructure code declares and versions. This repository stores no copy of it. Each
      # line of the key is masked, and so is its base64 form, because one mask command registers one line: that keeps
      # these two representations out of the log, not every possible re-encoding of the key.
      - name: Read the oss-verify App's key
        id: key
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          payload=$(curl -q -sSf -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://secretmanager.googleapis.com/v1/projects/theorem-agent-infra/secrets/oss-verify-github-app-key/versions/latest:access' \
            | jq -er '.payload.data | select(type == "string" and length > 0)')
          builtin printf '::add-mask::%s\n' "$payload"
          key=$(builtin printf '%s' "$payload" | base64 -d)
          while IFS= read -r line; do
            if [[ $line == *[![:space:]]* ]]; then builtin printf '::add-mask::%s\n' "$line"; fi
          done <<< "$key"
          delimiter="key-$(openssl rand -hex 16)"
          { echo "key<<$delimiter"; builtin printf '%s\n' "$key"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Get the oss-verify App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: Iv23liAWPMahJZYsw3un
          private-key: ${{ steps.key.outputs.key }}
          permission-pull-requests: write

      - name: Post the comment, or update the one already there
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REVIEW: ${{ needs.review.outputs.comment }}
          # The record of what answered the review: review-comment posts the review only if it shows the provider
          # asked for, and otherwise says that it is not published, and why.
          SERVED: ${{ needs.review.outputs.served }}
          REFUSED: ${{ needs.review.outputs.refused }}
          CHECKS: ${{ needs.project-builds.outputs.checks }}
          HEAD_SHA: ${{ needs.project-builds.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s' "$REVIEW" > "$RUNNER_TEMP/review.md"
          printf '%s' "$CHECKS" > "$RUNNER_TEMP/checks.md"
          printf '%s' "$SERVED" > "$RUNNER_TEMP/served"
          # Only a run of the pull request's current head posts: a run of an older head that finished later would
          # replace the newer head's review, or mark it not current. The current head's own run posts.
          current=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The pull request's head is now $current, not $HEAD_SHA: the run of $current posts the comment."
            exit 0
          fi
          # Ours is the oss-verify App's comment that starts with the marker.
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "oss-verify[bot]" and (.body | startswith("<!-- oss-verify-review -->"))) | .id')
          existing=${existing%%$'\n'*}
          # The comment already posted, whenever there is one: review-comment keeps it, marked not current (or as it
          # was, when it is the review of this same commit), if this push's review is empty, blank or refused once it
          # has screened it.
          previous=()
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" --jq .body > "$RUNNER_TEMP/previous.md"
            previous=(--previous "$RUNNER_TEMP/previous.md")
          fi
          refused=()
          [ "${REFUSED:-}" != true ] || refused=(--refused)
          python3 .github/scripts/review-comment --review "$RUNNER_TEMP/review.md" --checks "$RUNNER_TEMP/checks.md" \
            --head "$HEAD_SHA" --run "$RUN_URL" --served "$RUNNER_TEMP/served" "${refused[@]}" "${previous[@]}" \
            > "$RUNNER_TEMP/comment.md"
          if [ -n "$existing" ]; then
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' \
              | gh api --method PATCH "repos/$REPO/issues/comments/$existing" --input - > /dev/null
          else
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' \
              | gh api --method POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null
          fi
